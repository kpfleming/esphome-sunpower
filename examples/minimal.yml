esphome:
  name: pvs-minimal
  friendly_name: Minimal PVS Monitor

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  networks:
    - ssid: example-network
      password: network-password

api:

external_components:
  - source: github://kpfleming/esphome-sunpower@v2

sunpower_solar:
  serial: PVS1
  consumption_meter:
    serial: CM1
  production_meter:
    serial: PM1

sensor:
  - platform: sunpower_solar

    energy_from_grid: Energy From Grid
    energy_to_grid: Energy To Grid

    consumption_meter:
      lifetime_energy:
        name: Energy Consumed
        internal: true

    production_meter:
      lifetime_energy: Energy Produced

http_request:
  useragent: esphome/pvs
  timeout: 15s
  watchdog_timeout: 15s

interval:
  interval: 1min
  then:
    - delay: 15s
    - http_request.get:
        url: http://<PVS>/cgi-bin/dl_cgi?Command=DeviceList
        capture_response: true
        max_response_buffer_size: 35000
        on_response:
          then:
            - sunpower_solar.process: body
